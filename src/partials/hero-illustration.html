<div class="hero__visual reveal" data-delay="1">
  <svg viewBox="0 0 560 480" role="img" aria-labelledby="hero-illu-title">
    <title id="hero-illu-title">Illustration : une maison accueillante entourée des quatre services proposés</title>
    <defs>
      <linearGradient id="illu-navy" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#17406B"/><stop offset="1" stop-color="#0F2A44"/>
      </linearGradient>
      <linearGradient id="illu-aqua" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7FC8BC"/><stop offset="1" stop-color="#4FAF9F"/>
      </linearGradient>
      <linearGradient id="illu-window" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF4D6"/><stop offset="1" stop-color="#F6DFA4"/>
      </linearGradient>
    </defs>

    <!-- Fond organique -->
    <path d="M110 70c60-60 190-70 280-30s150 130 140 220-90 170-200 190S60 430 30 330 50 130 110 70z" fill="#DDF1EC"/>
    <path d="M160 110c50-40 150-45 220-10s110 105 100 170-70 125-150 140S90 390 70 320 110 150 160 110z" fill="#E3ECF5" opacity="0.8"/>

    <!-- Sol -->
    <ellipse cx="280" cy="398" rx="190" ry="16" fill="#0F2A44" opacity="0.08"/>

    <!-- Maison -->
    <g>
      <path d="M170 240 L280 150 L390 240 Z" fill="url(#illu-navy)"/>
      <rect x="192" y="232" width="176" height="160" rx="10" fill="#FFFFFF"/>
      <rect x="192" y="232" width="176" height="160" rx="10" fill="none" stroke="#0F2A44" stroke-opacity="0.08"/>
      <!-- cheminée -->
      <rect x="330" y="170" width="22" height="46" rx="4" fill="#2C5F8F"/>
      <path d="M341 160c-8 0-12-6-8-12 3-4 10-4 12 0s0 12-4 12z" fill="#7FC8BC" opacity="0.7"/>
      <!-- porte -->
      <rect x="258" y="312" width="44" height="80" rx="22" fill="url(#illu-aqua)"/>
      <circle cx="292" cy="358" r="3" fill="#FBF8F2"/>
      <!-- fenêtres -->
      <rect x="208" y="256" width="40" height="40" rx="8" fill="url(#illu-window)"/>
      <path d="M228 256v40M208 276h40" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="312" y="256" width="40" height="40" rx="8" fill="url(#illu-window)"/>
      <path d="M332 256v40M312 276h40" stroke="#FFFFFF" stroke-width="3"/>
      <!-- cœur sur la façade -->
      <path d="M280 300s-14-9-14-19a7.5 7.5 0 0 1 14-4.5 7.5 7.5 0 0 1 14 4.5c0 10-14 19-14 19z" fill="#E8B85B"/>
      <!-- plantes -->
      <path d="M210 392c0-20-14-30-22-30 0 14 8 26 22 30z" fill="#4FAF9F"/>
      <path d="M215 392c-4-24 6-38 18-40 2 16-6 34-18 40z" fill="#7FC8BC"/>
      <path d="M350 392c-2-22 8-34 20-36 2 16-8 32-20 36z" fill="#4FAF9F"/>
    </g>

    <!-- Pastilles des quatre services -->
    <g transform="translate(96 140)">
      <circle r="42" fill="#FFFFFF" stroke="#7FC8BC" stroke-width="3"/>
      <g transform="translate(-16 -16) scale(1.35)" fill="none" stroke="#2F8A7C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/><path d="M5 15l.6 1.6L7 17l-1.4.4L5 19l-.6-1.6L3 17l1.4-.4z"/>
      </g>
    </g>
    <g transform="translate(464 128)">
      <circle r="42" fill="#FFFFFF" stroke="#7FC8BC" stroke-width="3"/>
      <g transform="translate(-16 -16) scale(1.35)" fill="none" stroke="#17406B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3"/><path d="M4 21v-4a5 5 0 0 1 10 0v4"/><circle cx="17.5" cy="5.5" r="2.5"/><path d="M17.5 8v3l-3 4"/>
      </g>
    </g>
    <g transform="translate(84 330)">
      <circle r="42" fill="#FFFFFF" stroke="#7FC8BC" stroke-width="3"/>
      <g transform="translate(-16 -16) scale(1.35)" fill="none" stroke="#17406B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/><path d="M9 7h6"/><path d="M9 11h4"/>
      </g>
    </g>
    <g transform="translate(476 330)">
      <circle r="42" fill="#FFFFFF" stroke="#7FC8BC" stroke-width="3"/>
      <g transform="translate(-16 -16) scale(1.35)" fill="none" stroke="#2F8A7C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17v-3.5a2 2 0 0 1 .6-1.4L6 9.6A3 3 0 0 1 8.2 8.5h7.6a3 3 0 0 1 2.2 1.1l2.4 2.5a2 2 0 0 1 .6 1.4V17"/><path d="M3 17h18"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/><path d="M6.5 12.5h11"/>
      </g>
    </g>

    <!-- Petits éclats décoratifs -->
    <circle cx="150" cy="60" r="6" fill="#E8B85B"/>
    <circle cx="420" cy="60" r="4" fill="#4FAF9F"/>
    <circle cx="520" cy="240" r="5" fill="#E8B85B"/>
    <circle cx="40" cy="240" r="4" fill="#2C5F8F"/>
    <path d="M440 420l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#7FC8BC"/>
    <path d="M118 440l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#E8B85B"/>
  </svg>

  <div class="hero__float hero__float--1">
    <span class="icon-badge" aria-hidden="true">{{icon "bouclier"}}</span>
    <span>Assurée RC Pro<small>Interventions couvertes</small></span>
  </div>
  <div class="hero__float hero__float--2">
    <span class="icon-badge icon-badge--navy" aria-hidden="true">{{icon "calendrier"}}</span>
    <span>Devis sous 48 h<small>Gratuit et sans engagement</small></span>
  </div>
</div>
